<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Sim 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CANVAS PRINCIPAL (UMBLE TOT ECRANUL) -->
  <canvas id="game-canvas"></canvas>

  <!-- 1. ECRANUL PRINCIPAL (MAIN MENU) -->
  <div id="main-menu" class="overlay-screen">
    <div class="menu-content">
      <h1>Cozy Sim</h1>
      <p class="subtitle">A little life, just for you.</p>
      
      <div class="menu-buttons">
        <button class="menu-btn primary" id="play-btn">▶ Play</button>
        <button class="menu-btn" id="settings-btn">⚙ Settings</button>
        <button class="menu-btn" id="credits-btn">❤ Credits</button>
      </div>
      
      <div id="credits-text" style="display: none; margin-top: 20px; color: #8b7355; font-size: 0.9rem;">
        Made with love by Adrian 🌸
      </div>
    </div>
  </div>

  <!-- 2. SETTINGS MODAL -->
  <div id="settings-modal" class="overlay-screen">
    <div class="settings-box">
      <h2>Settings ⚙️</h2>
      <div class="setting-row">
        <label>Graphics Quality:</label>
        <select id="quality-select">
          <option value="high">High (Shadows)</option>
          <option value="low">Low (Faster)</option>
        </select>
      </div>
      <button class="close-btn" id="close-settings">Back to Menu</button>
    </div>
  </div>

  <!-- 3. CREATORUL DE PERSONAJ 3D -->
  <div id="creator-screen" class="overlay-screen" style="pointer-events: none;">
    <!-- Container transparent pentru a lăsa canvas-ul din spate să se vadă -->
    <div class="creator-layout" style="pointer-events: auto;">
      <div class="creator-options">
        <h1>Create your Sim 🌸</h1>
        
        <div class="creator-section">
          <label>Name</label>
          <input type="text" id="sim-name" placeholder="Your name..." maxlength="12" value="Sim">
        </div>

        <div class="creator-section">
          <label>Gender</label>
          <div class="btn-group" id="gender-picker">
            <button class="option-btn selected" data-gender="female">👩 Female</button>
            <button class="option-btn" data-gender="male">👨 Male</button>
          </div>
        </div>

        <div class="creator-section">
          <label>Skin Color</label>
          <div class="color-picker" id="skin-picker">
            <div class="color-option selected" style="background: #ffdfc4;" data-color="#ffdfc4"></div>
            <div class="color-option" style="background: #f0c8a0;" data-color="#f0c8a0"></div>
            <div class="color-option" style="background: #d4a373;" data-color="#d4a373"></div>
            <div class="color-option" style="background: #8d5524;" data-color="#8d5524"></div>
          </div>
        </div>

        <div class="creator-section">
          <label>Hair Color</label>
          <div class="color-picker" id="hair-picker">
            <div class="color-option selected" style="background: #6d4c41;" data-color="#6d4c41"></div>
            <div class="color-option" style="background: #f4d06f;" data-color="#f4d06f"></div>
            <div class="color-option" style="background: #1a1a1a;" data-color="#1a1a1a"></div>
            <div class="color-option" style="background: #d9a0b3;" data-color="#d9a0b3"></div>
          </div>
        </div>

        <div class="creator-section">
          <label>Shirt Color</label>
          <div class="color-picker" id="shirt-picker">
            <div class="color-option selected" style="background: #e8a87c;" data-color="#e8a87c"></div>
            <div class="color-option" style="background: #a8c3a6;" data-color="#a8c3a6"></div>
            <div class="color-option" style="background: #89b0ae;" data-color="#89b0ae"></div>
            <div class="color-option" style="background: #b19cd9;" data-color="#b19cd9"></div>
          </div>
        </div>

        <button class="start-btn" id="start-btn">Enter World</button>
      </div>
    </div>
  </div>

  <!-- 4. HUD JOC (Panou plutitor) -->
  <div id="game-hud">
    <div class="needs-panel">
      <h3 id="ui-sim-name">Needs</h3>
      
      <div class="need-row">
        <div class="need-label"><span>🍔 Hunger</span> <span id="val-foame">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-foame" id="bar-foame" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>⚡ Energy</span> <span id="val-energie">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-energie" id="bar-energie" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>🚿 Hygiene</span> <span id="val-igiena">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-igiena" id="bar-igiena" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>🎮 Fun</span> <span id="val-distractie">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-distractie" id="bar-distractie" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>💬 Social</span> <span id="val-social">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-social" id="bar-social" style="width: 100%;"></div></div>
      </div>
    </div>

    <!-- BUTOANE IN-GAME (Jos) -->
    <div class="game-actions">
      <button class="hud-btn" id="open-shop-btn">🛒 Buy</button>
      <button class="hud-btn" id="build-mode-btn">🔨 Build</button>
      <button class="hud-btn" id="floor-toggle-btn">🏠 Upstairs</button>
    </div>

    <div class="status-msg" id="status-msg">Drag to rotate / Scroll to zoom.</div>
  </div>

  <!-- 5. MAGAZIN -->
  <div id="shop-modal" class="overlay-screen">
    <div class="shop-box">
      <h2>Buy Furniture 🛋️</h2>
      <div class="shop-grid" id="shop-grid"></div>
      <button class="close-btn" id="close-shop">Close</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>

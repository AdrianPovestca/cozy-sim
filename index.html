<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Sim</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f5e6d3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      transition: background 2s ease;
    }

    .game-container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      max-width: 95vw;
    }

    canvas {
      background: #faf0e6;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      display: block;
      cursor: grab;
      transition: background 2s ease;
    }
    canvas:active { cursor: grabbing; }

    /* --- UI PANEL --- */
    .needs-panel {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      width: 250px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 400px;
    }

    .needs-panel h3 {
      color: #8b7355;
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 5px;
    }

    .need-row { display: flex; flex-direction: column; gap: 4px; }
    
    .need-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #6b5b4d;
      font-weight: 600;
    }

    .progress-bg {
      background: #f0e0d0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .fill-foame { background-color: #e8a87c; }
    .fill-energie { background-color: #a8c3a6; }
    .fill-igiena { background-color: #89b0ae; }
    .fill-distractie { background-color: #d9a0b3; }
    .fill-social { background-color: #f4d06f; }

    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      color: #a88f76;
      font-style: italic;
      margin-top: auto;
      padding-top: 10px;
    }

    /* --- BUTOANE JOC --- */
    .controls {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      background: #e8a87c;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover { background: #d68f62; }
    .btn-outline {
      background: transparent;
      color: #e8a87c;
      border: 2px solid #e8a87c;
    }
    .btn-outline:hover { background: #fff5ee; }
    .btn.active { background: #a8c3a6; border-color: #a8c3a6; color: white; }
    .btn.active:hover { background: #8fae8d; }
    
    .btn-danger { color: #e57373; border-color: #e57373; }
    .btn-danger:hover { background: #ffebee; }

    /* --- MODAL SHOP --- */
    #shop-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 50;
    }

    .shop-box { background: #fff; padding: 30px; border-radius: 20px; width: 500px; text-align: center; }
    .shop-box h2 { color: #8b7355; margin-bottom: 20px; }
    
    .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }

    .shop-item {
      background: #faf0e6; padding: 15px; border-radius: 12px; cursor: pointer;
      transition: transform 0.2s, background 0.2s; border: 2px solid transparent;
    }
    .shop-item:hover { transform: scale(1.05); background: #f0e0d0; }
    
    .shop-item-emoji { font-size: 30px; display: block; margin-bottom: 5px; }
    .shop-item-name { font-size: 14px; color: #6b5b4d; font-weight: bold; }

    /* --- CREATOR SCREEN --- */
    #creator-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #f5e6d3; display: flex; justify-content: center; align-items: center;
      flex-direction: column; z-index: 100;
    }

    .creator-box {
      background: #fff; padding: 40px; border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%;
    }

    .creator-box h1 { color: #8b7355; margin-bottom: 20px; font-size: 1.8rem; }
    .creator-box label { display: block; margin-bottom: 8px; color: #6b5b4d; font-weight: bold; }
    .creator-box input[type="text"] {
      width: 100%; padding: 12px; border: 2px solid #f0e0d0; border-radius: 10px;
      font-size: 1rem; margin-bottom: 20px; outline: none; text-align: center; color: #4a3728;
    }
    .creator-box input[type="text"]:focus { border-color: #e8a87c; }

    .color-picker { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
    .color-option {
      width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
      border: 3px solid transparent; transition: transform 0.2s;
    }
    .color-option:hover { transform: scale(1.1); }
    .color-option.selected { border-color: #4a3728; }

    .start-btn {
      background: #e8a87c; color: white; border: none; padding: 15px 30px;
      font-size: 1.1rem; border-radius: 12px; cursor: pointer; font-weight: bold;
      width: 100%; transition: background 0.2s;
    }
    .start-btn:hover { background: #d68f62; }
  </style>
</head>
<body>

  <div id="creator-screen">
    <div class="creator-box">
      <h1>Welcome! 🌸</h1>
      <p style="color: #a88f76; margin-bottom: 20px;">Create your sim for a cozy life.</p>
      
      <label>What is your name?</label>
      <input type="text" id="sim-name" placeholder="Your name..." maxlength="12" value="Sim">

      <label>Choose a color:</label>
      <div class="color-picker" id="color-picker">
        <div class="color-option" style="background: #e8a87c;" data-color="#e8a87c"></div>
        <div class="color-option" style="background: #a8c3a6;" data-color="#a8c3a6"></div>
        <div class="color-option" style="background: #89b0ae;" data-color="#89b0ae"></div>
        <div class="color-option" style="background: #d9a0b3;" data-color="#d9a0b3"></div>
        <div class="color-option" style="background: #b19cd9;" data-color="#b19cd9"></div>
      </div>

      <button class="start-btn" id="start-btn">Start Cozy Life</button>
    </div>
  </div>

  <div id="shop-modal">
    <div class="shop-box">
      <h2>Cozy Shop 🛍️</h2>
      <div class="shop-grid" id="shop-grid"></div>
      <button class="btn" id="close-shop-btn">Close</button>
    </div>
  </div>

  <div class="game-container">
    <canvas id="game" width="600" height="400"></canvas>
    
    <div class="needs-panel">
      <h3 id="ui-sim-name">Needs</h3>
      
      <div class="need-row">
        <div class="need-label"><span>🍔 Hunger</span> <span id="val-foame">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-foame" id="bar-foame" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>⚡ Energy</span> <span id="val-energie">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-energie" id="bar-energie" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>🚿 Hygiene</span> <span id="val-igiena">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-igiena" id="bar-igiena" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>🎮 Fun</span> <span id="val-distractie">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-distractie" id="bar-distractie" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>💬 Social</span> <span id="val-social">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-social" id="bar-social" style="width: 100%;"></div></div>
      </div>

      <div class="status-msg" id="status-msg">Click to move / drag background to pan.</div>

      <div class="controls">
        <button class="btn" id="open-shop-btn">🛒 Add Objects</button>
        <button class="btn btn-outline" id="edit-mode-btn">✏️ Edit Room</button>
        <button class="btn btn-outline btn-danger" id="reset-btn" style="font-size: 0.8rem; padding: 8px;">🔄 Reset Life</button>
      </div>
    </div>
  </div>

  <script>
    window.onload = () => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      // --- AUDIO ---
      let audioCtx = null;
      function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      function playPop() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      }

      // --- GAME STATE ---
      let timeOfDay = 12;
      let gameTime = 0;
      let isEditMode = false;
      
      let camera = { x: 0, y: 0, zoom: 1 };
      let isPanning = false;
      let panStart = { x: 0, y: 0 };
      let hasMoved = false;

      let sim = {
        x: 300, y: 250, targetX: 300, targetY: 250,
        speed: 3, color: '#e8a87c', name: 'Sim',
        state: 'idle', actionTimer: 0, bobOffset: 0,
        facingRight: true
      };

      let npc = {
        x: 200, y: 200, targetX: 200, targetY: 200,
        speed: 1.5, color: '#b19cd9', name: 'Pufi',
        state: 'idle', actionTimer: 0, bobOffset: 0,
        speechBubble: null, speechTimer: 0, facingRight: true
      };

      let needs = { foame: 100, energie: 100, igiena: 100, distractie: 100, social: 100 };

      // House layout definitions
      const WALLS = [
        { x: 50, y: 50, w: 500, h: 20 },   // Top wall
        { x: 50, y: 50, w: 20, h: 300 },   // Left wall
        { x: 530, y: 50, w: 20, h: 300 },  // Right wall
        { x: 50, y: 330, w: 200, h: 20 },  // Bottom left wall
        { x: 350, y: 330, w: 200, h: 20 }, // Bottom right wall
      ];
      
      // Windows for visual
      const WINDOWS = [
        { x: 200, y: 50, w: 100, h: 20 },
        { x: 50, y: 150, w: 20, h: 80 },
        { x: 530, y: 150, w: 20, h: 80 },
      ];

      // Interior wall (split bedroom/living)
      const INNER_WALL = { x: 300, y: 50, w: 20, h: 120 };

      let objects = [
        { id: 'fridge', name: 'Fridge', x: 70, y: 70, w: 40, h: 60, color: '#d1d5db', need: 'foame', emoji: '🍔' },
        { id: 'shower', name: 'Shower', x: 70, y: 270, w: 40, h: 40, color: '#bfdbfe', need: 'igiena', emoji: '🚿' },
        { id: 'tv', name: 'TV', x: 420, y: 270, w: 60, h: 40, color: '#4b5563', need: 'distractie', emoji: '🎮' },
        { id: 'bed', name: 'Bed', x: 420, y: 70, w: 80, h: 50, color: '#fbcfe8', need: 'energie', emoji: '⚡' }
      ];

      const shopCatalog = [
        { id: 'plant', name: 'Plant', w: 30, h: 40, color: '#a8c3a6', emoji: '🪴', need: 'igiena' },
        { id: 'lamp', name: 'Lamp', w: 30, h: 50, color: '#f4d06f', emoji: '💡', need: 'distractie' },
        { id: 'sofa', name: 'Sofa', w: 80, h: 40, color: '#d9a0b3', emoji: '🛋️', need: 'energie' },
        { id: 'picture', name: 'Picture', w: 50, h: 40, color: '#e8a87c', emoji: '🖼️', need: 'distractie' }
      ];

      const dialogues = [
        "How are you today?", "I love your home!", "Don't forget to eat!",
        "Let's watch a movie.", "It's a beautiful day outside.", "I'm glad you're here!"
      ];

      let gameStarted = false;

      // --- CREATOR ---
      document.getElementById('color-picker').addEventListener('click', (e) => {
        if (e.target.classList.contains('color-option')) {
          document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
          e.target.classList.add('selected');
          sim.color = e.target.dataset.color;
        }
      });
      document.querySelector('.color-option').classList.add('selected');

      document.getElementById('start-btn').addEventListener('click', () => {
        const nameInput = document.getElementById('sim-name').value.trim();
        if (nameInput) sim.name = nameInput;
        
        document.getElementById('ui-sim-name').innerText = sim.name;
        document.getElementById('creator-screen').style.display = 'none';
        gameStarted = true;
        
        initAudio();
        playPop();
        saveGame();
      });

      // --- SAVE / LOAD / RESET ---
      function saveGame() {
        localStorage.setItem('cozySimData', JSON.stringify({
          name: sim.name, color: sim.color, needs: needs, timeOfDay: timeOfDay, objects: objects
        }));
      }

      const savedData = localStorage.getItem('cozySimData');
      if (savedData) {
        const data = JSON.parse(savedData);
        document.getElementById('sim-name').value = data.name;
        sim.name = data.name;
        sim.color = data.color;
        needs = data.needs;
        if (data.timeOfDay) timeOfDay = data.timeOfDay;
        if (data.objects) objects = data.objects;
        
        document.querySelectorAll('.color-option').forEach(el => {
          if (el.dataset.color === data.color) el.classList.add('selected');
        });
      }

      document.getElementById('reset-btn').addEventListener('click', () => {
        if (confirm("Are you sure you want to delete all progress?")) {
          localStorage.removeItem('cozySimData');
          location.reload();
        }
      });

      // --- SHOP ---
      const shopModal = document.getElementById('shop-modal');
      const shopGrid = document.getElementById('shop-grid');
      
      document.getElementById('open-shop-btn').addEventListener('click', () => {
        playPop();
        shopGrid.innerHTML = '';
        shopCatalog.forEach(item => {
          const div = document.createElement('div');
          div.className = 'shop-item';
          div.innerHTML = `<span class="shop-item-emoji">${item.emoji}</span><span class="shop-item-name">${item.name}</span>`;
          div.addEventListener('click', () => {
            // Place new object safely inside the house
            const newObj = { ...item, x: 150 + Math.random()*250, y: 150 + Math.random()*150 };
            objects.push(newObj);
            saveGame();
            shopModal.style.display = 'none';
            document.getElementById('status-msg').innerText = "Added " + item.name + "!";
            playPop();
          });
          shopGrid.appendChild(div);
        });
        shopModal.style.display = 'flex';
      });

      document.getElementById('close-shop-btn').addEventListener('click', () => {
        shopModal.style.display = 'none';
      });

      // --- EDIT MODE ---
      const editBtn = document.getElementById('edit-mode-btn');
      editBtn.addEventListener('click', () => {
        playPop();
        isEditMode = !isEditMode;
        if (isEditMode) {
          editBtn.innerText = "✅ Save & Exit";
          editBtn.classList.add('active');
          document.getElementById('status-msg').innerText = "Drag objects with the mouse!";
        } else {
          editBtn.innerText = "✏️ Edit Room";
          editBtn.classList.remove('active');
          document.getElementById('status-msg').innerText = "Game mode active.";
          saveGame();
        }
      });

      // --- UPDATE LOGIC ---
      function update() {
        if (!gameStarted) return;

        gameTime++;
        if (gameTime >= 60) {
            timeOfDay += 0.1;
            if (timeOfDay >= 24) timeOfDay = 0;
            gameTime = 0;
        }

        needs.foame = Math.max(0, needs.foame - 0.015);
        needs.energie = Math.max(0, needs.energie - 0.01);
        needs.igiena = Math.max(0, needs.igiena - 0.008);
        needs.distractie = Math.max(0, needs.distractie - 0.02);
        needs.social = Math.max(0, needs.social - 0.012);

        sim.bobOffset = Math.sin(Date.now() / 500) * 2;
        npc.bobOffset = Math.sin(Date.now() / 550) * 2;

        if (!isEditMode) {
            if (sim.state === 'walking') {
            const dx = sim.targetX - sim.x;
            const dy = sim.targetY - sim.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > sim.speed) {
                sim.x += (dx / dist) * sim.speed;
                sim.y += (dy / dist) * sim.speed;
                if (dx > 0.1) sim.facingRight = true;
                else if (dx < -0.1) sim.facingRight = false;
            } else {
                sim.x = sim.targetX;
                sim.y = sim.targetY;
                sim.state = 'using';
                sim.actionTimer = 120;
            }
            } else if (sim.state === 'using') {
            sim.actionTimer--;
            if (sim.actionTimer <= 0) sim.state = 'idle';
            }
        }

        if (npc.speechTimer > 0) {
            npc.speechTimer--;
            if (npc.speechTimer <= 0) npc.speechBubble = null;
        }

        if (npc.state === 'idle') {
          if (Math.random() < 0.005) {
            npc.targetX = 100 + Math.random() * 350;
            npc.targetY = 100 + Math.random() * 200;
            npc.state = 'walking';
          }
        } else if (npc.state === 'walking') {
          const dx = npc.targetX - npc.x;
          const dy = npc.targetY - npc.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > npc.speed) {
            npc.x += (dx / dist) * npc.speed;
            npc.y += (dy / dist) * npc.speed;
            if (dx > 0.1) npc.facingRight = true;
            else if (dx < -0.1) npc.facingRight = false;
          } else {
            npc.state = 'idle';
          }
        }

        const updateBar = (id, val) => {
          document.getElementById('val-' + id).innerText = Math.round(val) + '%';
          document.getElementById('bar-' + id).style.width = val + '%';
        };
        updateBar('foame', needs.foame);
        updateBar('energie', needs.energie);
        updateBar('igiena', needs.igiena);
        updateBar('distractie', needs.distractie);
        updateBar('social', needs.social);
      }

      // --- DRAWING ---
      function draw() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#faf0e6';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (!gameStarted) return;

        // Apply Camera
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(camera.zoom, camera.zoom);
        ctx.translate(-canvas.width / 2 + camera.x, -canvas.height / 2 + camera.y);

        // Draw Floor (Wood)
        ctx.fillStyle = '#e8d5c4';
        ctx.fillRect(50, 50, 500, 300);
        
        // Draw room separator line
        ctx.fillStyle = '#c1a893';
        ctx.fillRect(50, 170, 500, 4); // Horizontal separator

        // Draw Windows (Sky)
        let skyColor = '#87CEEB'; // Day
        if (timeOfDay < 6 || timeOfDay > 20) skyColor = '#1a1a3a'; // Night
        else if (timeOfDay < 8) skyColor = '#ffb347'; // Sunrise
        else if (timeOfDay > 18) skyColor = '#ff7f50'; // Sunset

        WINDOWS.forEach(win => {
            ctx.fillStyle = skyColor;
            ctx.fillRect(win.x, win.y, win.w, win.h);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.strokeRect(win.x, win.y, win.w, win.h);
        });

        // Draw Walls
        ctx.fillStyle = '#fdfbf7';
        ctx.shadowColor = 'rgba(0,0,0,0.1)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 5;
        WALLS.forEach(wall => {
            ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
        });
        ctx.fillRect(INNER_WALL.x, INNER_WALL.y, INNER_WALL.w, INNER_WALL.h);
        ctx.shadowColor = 'transparent';

        // Draw Door
        ctx.fillStyle = '#8b7355';
        ctx.fillRect(250, 330, 50, 20);
        ctx.fillStyle = '#f4d06f';
        ctx.beginPath(); ctx.arc(290, 340, 3, 0, Math.PI*2); ctx.fill();

        // Objects
        objects.forEach(obj => {
          ctx.fillStyle = obj.color;
          ctx.beginPath();
          ctx.shadowColor = 'rgba(0,0,0,0.1)';
          ctx.shadowBlur = 4;
          ctx.shadowOffsetY = 2;
          ctx.roundRect(obj.x, obj.y, obj.w, obj.h, 8);
          ctx.fill();
          ctx.shadowColor = 'transparent';

          ctx.font = '24px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(obj.emoji, obj.x + obj.w / 2, obj.y - 10);
          ctx.font = '10px system-ui';
          ctx.fillStyle = '#6b5b4d';
          ctx.fillText(obj.name, obj.x + obj.w / 2, obj.y + obj.h + 15);
        });

        // Characters
        function drawCharacter(char, isNPC) {
          let yOffset = char.bobOffset;
          ctx.save();
          ctx.translate(char.x, char.y + yOffset);

          ctx.fillStyle = 'rgba(0,0,0,0.1)';
          ctx.beginPath(); ctx.ellipse(0, 15, 12, 4, 0, 0, Math.PI * 2); ctx.fill();

          if (!char.facingRight) ctx.scale(-1, 1);

          let cColor = char.color;
          if (!isNPC && (needs.foame < 20 || needs.energie < 20)) cColor = '#e57373';
          const darkerColor = isNPC ? '#8c72b5' : (cColor === '#e57373' ? '#c95b5b' : '#c4865a');

          ctx.fillStyle = darkerColor;
          ctx.beginPath(); ctx.roundRect(-6, 8, 4, 8, 2); ctx.fill();
          ctx.beginPath(); ctx.roundRect(2, 8, 4, 8, 2); ctx.fill();

          ctx.fillStyle = cColor;
          ctx.beginPath(); ctx.roundRect(-10, -10, 20, 20, 8); ctx.fill();

          ctx.beginPath(); ctx.arc(-12, 0, 4, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(12, 0, 4, 0, Math.PI*2); ctx.fill();

          ctx.beginPath(); ctx.arc(0, -16, 12, 0, Math.PI * 2); ctx.fill();

          ctx.fillStyle = '#4a3728';
          ctx.beginPath(); ctx.arc(3, -18, 2, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(8, -18, 2, 0, Math.PI * 2); ctx.fill();

          ctx.fillStyle = 'rgba(255, 150, 150, 0.4)';
          ctx.beginPath(); ctx.arc(0, -14, 3, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(10, -14, 3, 0, Math.PI*2); ctx.fill();

          ctx.restore();

          ctx.font = '12px system-ui';
          ctx.fillStyle = '#8b7355';
          ctx.textAlign = 'center';
          ctx.fillText(char.name, char.x, char.y - 36 + yOffset);
        }

        drawCharacter(npc, true);
        drawCharacter(sim, false);

        // NPC Dialogue
        if (npc.speechBubble) {
            ctx.fillStyle = 'white'; ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 2;
            ctx.font = '12px system-ui';
            const textWidth = ctx.measureText(npc.speechBubble).width;
            const boxW = textWidth + 20; const boxH = 30;
            const boxX = npc.x - boxW / 2; const boxY = npc.y - 80 + npc.bobOffset;

            ctx.beginPath(); ctx.roundRect(boxX, boxY, boxW, boxH, 8); ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(npc.x - 5, boxY + boxH); ctx.lineTo(npc.x + 5, boxY + boxH);
            ctx.lineTo(npc.x, boxY + boxH + 8); ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#4a3728'; ctx.textAlign = 'center';
            ctx.fillText(npc.speechBubble, npc.x, boxY + 19);
        }

        // Thought Bubble
        let lowestNeed = 'foame'; let lowestVal = needs.foame;
        if (needs.energie < lowestVal) { lowestVal = needs.energie; lowestNeed = 'energie'; }
        if (needs.igiena < lowestVal) { lowestVal = needs.igiena; lowestNeed = 'igiena'; }
        if (needs.distractie < lowestVal) { lowestVal = needs.distractie; lowestNeed = 'distractie'; }
        if (needs.social < lowestVal) { lowestVal = needs.social; lowestNeed = 'social'; }

        if (lowestVal < 30 && sim.state === 'idle') {
          const needObj = objects.find(o => o.need === lowestNeed) || { emoji: '💬' };
          ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.beginPath(); ctx.arc(sim.x + 20, sim.y - 50 + sim.bobOffset, 15, 0, Math.PI * 2); ctx.fill();
          ctx.font = '16px Arial'; ctx.textAlign = 'center';
          ctx.fillText(needObj.emoji, sim.x + 20, sim.y - 45 + sim.bobOffset);
        }

        // Night Overlay
        ctx.setTransform(1, 0, 0, 1, 0, 0); 
        let dayNightAlpha = 0;
        if (timeOfDay < 6 || timeOfDay > 20) dayNightAlpha = 0.6;
        else if (timeOfDay < 8) dayNightAlpha = 0.6 - ((timeOfDay - 6) / 2) * 0.6;
        else if (timeOfDay > 18) dayNightAlpha = ((timeOfDay - 18) / 2) * 0.6;

        if (dayNightAlpha > 0) {
            ctx.fillStyle = `rgba(30, 40, 70, ${dayNightAlpha})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // Cozy indoor light
            const gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 50, canvas.width/2, canvas.height/2, 400);
            gradient.addColorStop(0, `rgba(255, 200, 100, ${dayNightAlpha * 0.5})`);
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Clock
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.beginPath(); ctx.roundRect(535, 15, 50, 25, 8); ctx.fill();
        ctx.font = '12px system-ui'; ctx.fillStyle = '#6b5b4d'; ctx.textAlign = 'center';
        const hourStr = Math.floor(timeOfDay).toString().padStart(2, '0');
        const minStr = Math.floor((timeOfDay % 1) * 60).toString().padStart(2, '0');
        ctx.fillText(`⏰ ${hourStr}:${minStr}`, 560, 32);
      }

      // --- INTERACTION ---
      function getMouseWorldPos(e) {
        const rect = canvas.getBoundingClientRect();
        const screenX = (e.clientX - rect.left) * (canvas.width / rect.width);
        const screenY = (e.clientY - rect.top) * (canvas.height / rect.height);
        const worldX = (screenX - canvas.width / 2) / camera.zoom + canvas.width / 2 - camera.x;
        const worldY = (screenY - canvas.height / 2) / camera.zoom + canvas.height / 2 - camera.y;
        return { x: worldX, y: worldY };
      }

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomAmount = e.deltaY > 0 ? -0.1 : 0.1;
        camera.zoom = Math.max(0.5, Math.min(3, camera.zoom + zoomAmount));
      });

      canvas.addEventListener('mousedown', (e) => {
        if (!gameStarted) return;
        hasMoved = false;
        const rect = canvas.getBoundingClientRect();
        const screenX = (e.clientX - rect.left) * (canvas.width / rect.width);
        const screenY = (e.clientY - rect.top) * (canvas.height / rect.height);

        if (isEditMode) {
          const worldPos = getMouseWorldPos(e);
          const obj = getObjectAt(worldPos.x, worldPos.y);
          if (obj) {
            draggedObject = obj;
            dragOffsetX = worldPos.x - obj.x;
            dragOffsetY = worldPos.y - obj.y;
            return;
          }
        }
        isPanning = true;
        panStart = { x: screenX - camera.x * camera.zoom, y: screenY - camera.y * camera.zoom };
      });

      canvas.addEventListener('mousemove', (e) => {
        if (!gameStarted) return;
        hasMoved = true;
        const rect = canvas.getBoundingClientRect();
        const screenX = (e.clientX - rect.left) * (canvas.width / rect.width);
        const screenY = (e.clientY - rect.top) * (canvas.height / rect.height);

        if (isEditMode && draggedObject) {
          const worldPos = getMouseWorldPos(e);
          draggedObject.x = worldPos.x - dragOffsetX;
          draggedObject.y = worldPos.y - dragOffsetY;
        } else if (isPanning) {
          camera.x = (screenX - panStart.x) / camera.zoom;
          camera.y = (screenY - panStart.y) / camera.zoom;
        }
      });

      canvas.addEventListener('mouseup', () => {
        isPanning = false;
        if (draggedObject) draggedObject = null;
      });

      canvas.addEventListener('click', (e) => {
        if (!gameStarted || isEditMode || hasMoved) return; 
        const worldPos = getMouseWorldPos(e);
        
        // Simple wall collision check (don't walk outside)
        if (worldPos.x < 70 || worldPos.x > 530 || worldPos.y < 70 || worldPos.y > 330) {
            return;
        }

        const clickX = worldPos.x;
        const clickY = worldPos.y;

        const dxNpc = clickX - npc.x;
        const dyNpc = clickY - npc.y;
        if (Math.sqrt(dxNpc*dxNpc + dyNpc*dyNpc) < 30) {
          sim.targetX = npc.x - 30;
          sim.targetY = npc.y;
          sim.state = 'walking';
          needs.social = Math.min(100, needs.social + 50);
          document.getElementById('status-msg').innerText = "Talking to " + npc.name + "! 💬";
          npc.speechBubble = dialogues[Math.floor(Math.random() * dialogues.length)];
          npc.speechTimer = 180;
          return;
        }

        const clickedObject = getObjectAt(clickX, clickY);
        if (clickedObject) {
          sim.targetX = clickedObject.x + clickedObject.w / 2;
          sim.targetY = clickedObject.y + clickedObject.h + 25;
          sim.state = 'walking';
          if (clickedObject.need) {
              needs[clickedObject.need] = Math.min(100, needs[clickedObject.need] + 40);
          }
          document.getElementById('status-msg').innerText = "Using " + clickedObject.name;
        } else {
          sim.targetX = clickX;
          sim.targetY = clickY;
          sim.state = 'walking';
        }
      });

      function getObjectAt(x, y) {
        for (let obj of objects) {
            if (x >= obj.x && x <= obj.x + obj.w && y >= obj.y && y <= obj.y + obj.h) return obj;
        }
        return null;
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      loop();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Sim 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f5e6d3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    .game-container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      max-width: 95vw;
      height: 95vh;
    }

    #game-wrapper {
      position: relative;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      overflow: hidden;
      background: #faf0e6;
    }

    #game-canvas {
      display: block;
      cursor: grab;
      width: 800px;
      height: 600px;
    }
    #game-canvas:active { cursor: grabbing; }

    /* --- UI PANEL --- */
    .needs-panel {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      width: 250px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 600px;
      overflow-y: auto;
    }

    .needs-panel h3 {
      color: #8b7355;
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 5px;
    }

    .need-row { display: flex; flex-direction: column; gap: 4px; }
    
    .need-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #6b5b4d;
      font-weight: 600;
    }

    .progress-bg {
      background: #f0e0d0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .fill-foame { background-color: #e8a87c; }
    .fill-energie { background-color: #a8c3a6; }
    .fill-igiena { background-color: #89b0ae; }
    .fill-distractie { background-color: #d9a0b3; }
    .fill-social { background-color: #f4d06f; }

    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      color: #a88f76;
      font-style: italic;
      margin-top: auto;
      padding-top: 10px;
      min-height: 40px;
    }

    /* --- CREATOR SCREEN --- */
    #creator-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #f5e6d3; display: flex; justify-content: center; align-items: center;
      flex-direction: column; z-index: 100;
    }

    .creator-box {
      background: #fff; padding: 40px; border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%;
    }

    .creator-box h1 { color: #8b7355; margin-bottom: 20px; font-size: 1.8rem; }
    .creator-box label { display: block; margin-bottom: 8px; color: #6b5b4d; font-weight: bold; }
    .creator-box input[type="text"] {
      width: 100%; padding: 12px; border: 2px solid #f0e0d0; border-radius: 10px;
      font-size: 1rem; margin-bottom: 20px; outline: none; text-align: center; color: #4a3728;
    }
    .creator-box input[type="text"]:focus { border-color: #e8a87c; }

    .color-picker { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
    .color-option {
      width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
      border: 3px solid transparent; transition: transform 0.2s;
    }
    .color-option:hover { transform: scale(1.1); }
    .color-option.selected { border-color: #4a3728; }

    .start-btn {
      background: #e8a87c; color: white; border: none; padding: 15px 30px;
      font-size: 1.1rem; border-radius: 12px; cursor: pointer; font-weight: bold;
      width: 100%; transition: background 0.2s;
    }
    .start-btn:hover { background: #d68f62; }
  </style>
</head>
<body>

  <div id="creator-screen">
    <div class="creator-box">
      <h1>Welcome! 🌸</h1>
      <p style="color: #a88f76; margin-bottom: 20px;">Create your human sim.</p>
      
      <label>What is your name?</label>
      <input type="text" id="sim-name" placeholder="Your name..." maxlength="12" value="Sim">

      <label>Choose a shirt color:</label>
      <div class="color-picker" id="color-picker">
        <div class="color-option" style="background: #e8a87c;" data-color="#e8a87c"></div>
        <div class="color-option" style="background: #a8c3a6;" data-color="#a8c3a6"></div>
        <div class="color-option" style="background: #89b0ae;" data-color="#89b0ae"></div>
        <div class="color-option" style="background: #d9a0b3;" data-color="#d9a0b3"></div>
        <div class="color-option" style="background: #b19cd9;" data-color="#b19cd9"></div>
      </div>

      <button class="start-btn" id="start-btn">Start Cozy Life</button>
    </div>
  </div>

  <div class="game-container">
    <div id="game-wrapper">
      <canvas id="game-canvas"></canvas>
    </div>
    
    <div class="needs-panel">
      <h3 id="ui-sim-name">Needs</h3>
      
      <div class="need-row">
        <div class="need-label"><span>🍔 Hunger</span> <span id="val-foame">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-foame" id="bar-foame" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>⚡ Energy</span> <span id="val-energie">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-energie" id="bar-energie" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>🚿 Hygiene</span> <span id="val-igiena">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-igiena" id="bar-igiena" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>🎮 Fun</span> <span id="val-distractie">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-distractie" id="bar-distractie" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>💬 Social</span> <span id="val-social">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-social" id="bar-social" style="width: 100%;"></div></div>
      </div>

      <div class="status-msg" id="status-msg">Drag to rotate / Right-click to pan.</div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- SETUP ---
    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(800, 600);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#87CEEB'); // Cer albastru
    scene.fog = new THREE.Fog('#87CEEB', 30, 60);

    const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 100);
    camera.position.set(15, 15, 15);

    // --- CONTROALE CAMERA (Ca la Sims) ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // Să nu intre sub pământ
    controls.minDistance = 5;
    controls.maxDistance = 35;

    // --- LUMINI ---
    const ambientLight = new THREE.AmbientLight('#fff5e6', 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight('#ffe8c4', 1.2);
    sunLight.position.set(20, 30, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.left = -30;
    sunLight.shadow.camera.right = 30;
    sunLight.shadow.camera.top = 30;
    sunLight.shadow.camera.bottom = -30;
    scene.add(sunLight);

    // --- MEDIU (IARBĂ, STRADĂ, VECINI) ---
    const grass = new THREE.Mesh(
        new THREE.PlaneGeometry(100, 100),
        new THREE.MeshStandardMaterial({ color: '#8fbc8f' })
    );
    grass.rotation.x = -Math.PI / 2;
    grass.receiveShadow = true;
    scene.add(grass);

    // Case vecini (simple)
    function createNeighborHouse(x, z, color) {
        const group = new THREE.Group();
        const base = new THREE.Mesh(new THREE.BoxGeometry(8, 6, 8), new THREE.MeshStandardMaterial({ color }));
        base.position.y = 3;
        base.castShadow = true; base.receiveShadow = true;
        
        const roof = new THREE.Mesh(new THREE.ConeGeometry(7, 3, 4), new THREE.MeshStandardMaterial({ color: '#a05a5a' }));
        roof.position.y = 7.5;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;

        group.add(base, roof);
        group.position.set(x, 0, z);
        scene.add(group);
    }
    createNeighborHouse(-25, -15, '#ffd1b3');
    createNeighborHouse(25, -20, '#b3e0ff');
    createNeighborHouse(-30, 15, '#d9b3ff');

    // --- CASA SIM-ULUI (2 ETAJE) ---
    const houseGroup = new THREE.Group();
    const wallMat = new THREE.MeshStandardMaterial({ color: '#fdfbf7' });
    const floorMat = new THREE.MeshStandardMaterial({ color: '#e8d5c4' });

    // Etaj 1
    const floor1 = new THREE.Mesh(new THREE.BoxGeometry(16, 0.2, 16), floorMat);
    floor1.position.y = 0.1;
    floor1.receiveShadow = true;
    houseGroup.add(floor1);

    // Pereți Etaj 1 (deschis la față pentru vizibilitate)
    const w1_back = new THREE.Mesh(new THREE.BoxGeometry(16, 4, 0.2), wallMat); w1_back.position.set(0, 2, -8); w1_back.castShadow = true; w1_back.receiveShadow = true;
    const w1_left = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 16), wallMat); w1_left.position.set(-8, 2, 0); w1_left.castShadow = true; w1_left.receiveShadow = true;
    const w1_right = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 16), wallMat); w1_right.position.set(8, 2, 0); w1_right.castShadow = true; w1_right.receiveShadow = true;
    houseGroup.add(w1_back, w1_left, w1_right);

    // Etaj 2 (Dormitor + Baie)
    const floor2 = new THREE.Mesh(new THREE.BoxGeometry(16, 0.2, 16), floorMat);
    floor2.position.y = 4.1;
    floor2.castShadow = true; floor2.receiveShadow = true;
    houseGroup.add(floor2);

    const w2_back = new THREE.Mesh(new THREE.BoxGeometry(16, 4, 0.2), wallMat); w2_back.position.set(0, 6, -8); w2_back.castShadow = true;
    const w2_left = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 16), wallMat); w2_left.position.set(-8, 6, 0); w2_left.castShadow = true;
    const w2_right = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 16), wallMat); w2_right.position.set(8, 6, 0); w2_right.castShadow = true;
    // Pereți interiori etaj 2
    const w2_inner1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 8), wallMat); w2_inner1.position.set(0, 6, -4); w2_inner1.castShadow = true;
    const w2_inner2 = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 0.2), wallMat); w2_inner2.position.set(-4, 6, 0); w2_inner2.castShadow = true;
    houseGroup.add(w2_back, w2_left, w2_right, w2_inner1, w2_inner2);

    scene.add(houseGroup);

    // --- MOBILĂ 3D ---
    const interactables = [];

    function addFurniture(mesh, type, pos) {
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        interactables.push({ mesh, type, pos });
    }

    // --- MOBILĂ ETAJ 1 (Living & Bucătărie) ---
    // Canapea
    const sofaBase = new THREE.Mesh(new THREE.BoxGeometry(4, 1, 2), new THREE.MeshStandardMaterial({ color: '#d9a0b3' }));
    sofaBase.position.set(-4, 0.6, 4);
    const sofaBack = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 0.5), new THREE.MeshStandardMaterial({ color: '#c48698' }));
    sofaBack.position.set(-4, 1.35, 5);
    addFurniture(sofaBase, 'energie', new THREE.Vector3(-4, 0, 4));
    scene.add(sofaBack);

    // TV
    const tvStand = new THREE.Mesh(new THREE.BoxGeometry(3, 0.8, 1.5), new THREE.MeshStandardMaterial({ color: '#4b5563' }));
    tvStand.position.set(4, 0.5, 4);
    const tvScreen = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.6, 0.1), new THREE.MeshStandardMaterial({ color: '#1a1a1a' }));
    tvScreen.position.set(4, 1.7, 4);
    addFurniture(tvStand, 'distractie', new THREE.Vector3(4, 0, 4));
    scene.add(tvScreen);

    // Frigider
    const fridge = new THREE.Mesh(new THREE.BoxGeometry(2, 3.5, 2), new THREE.MeshStandardMaterial({ color: '#d1d5db' }));
    fridge.position.set(-6, 1.75, -6);
    addFurniture(fridge, 'foame', new THREE.Vector3(-6, 0, -6));

    // --- MOBILĂ ETAJ 2 (Dormitor & Baie) ---
    // Pat (Etaj 2)
    const bedBase = new THREE.Mesh(new THREE.BoxGeometry(3, 0.8, 4.5), new THREE.MeshStandardMaterial({ color: '#8b5a2b' }));
    bedBase.position.set(-5, 4.6, -5);
    const bedMattrass = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.4, 4.2), new THREE.MeshStandardMaterial({ color: '#fff' }));
    bedMattrass.position.set(-5, 5.1, -5);
    const bedPillow = new THREE.Mesh(new THREE.BoxGeometry(2, 0.3, 1), new THREE.MeshStandardMaterial({ color: '#fbcfe8' }));
    bedPillow.position.set(-5, 5.4, -6.5);
    addFurniture(bedBase, 'energie', new THREE.Vector3(-5, 4, -5));
    scene.add(bedMattrass, bedPillow);

    // Duș (Etaj 2)
    const showerBase = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.2, 2.5), new THREE.MeshStandardMaterial({ color: '#bfdbfe' }));
    showerBase.position.set(5, 4.2, -5);
    const showerGlass = new THREE.Mesh(new THREE.BoxGeometry(2.5, 3, 0.1), new THREE.MeshStandardMaterial({ color: '#fff', transparent: true, opacity: 0.3 }));
    showerGlass.position.set(5, 5.7, -3.8);
    addFurniture(showerBase, 'igiena', new THREE.Vector3(5, 4, -5));
    scene.add(showerGlass);

    // --- PERSONAJE UMANE 3D (FĂRĂ ROBLOX) ---
    function createHumanCharacter(name, shirtColor, isNPC) {
      const group = new THREE.Group();
      
      const skinMat = new THREE.MeshStandardMaterial({ color: '#ffdfc4' });
      const pantsMat = new THREE.MeshStandardMaterial({ color: isNPC ? '#4a5568' : '#5c6bc0' });
      const shirtMat = new THREE.MeshStandardMaterial({ color: shirtColor });
      const hairMat = new THREE.MeshStandardMaterial({ color: '#6d4c41' });

      // Picioare (cilindri)
      const legGeo = new THREE.CylinderGeometry(0.2, 0.2, 1, 8);
      const legL = new THREE.Mesh(legGeo, pantsMat);
      legL.position.set(-0.25, 0.5, 0);
      legL.castShadow = true;
      const legR = new THREE.Mesh(legGeo, pantsMat);
      legR.position.set(0.25, 0.5, 0);
      legR.castShadow = true;

      // Corp (trunchi conic/rotunjit)
      const torsoGeo = new THREE.CylinderGeometry(0.4, 0.5, 1.2, 8);
      const torso = new THREE.Mesh(torsoGeo, shirtMat);
      torso.position.set(0, 1.6, 0);
      torso.castShadow = true;

      // Mâini (cilindri)
      const armGeo = new THREE.CylinderGeometry(0.15, 0.15, 1, 8);
      const armL = new THREE.Mesh(armGeo, skinMat);
      armL.position.set(-0.6, 1.6, 0);
      armL.castShadow = true;
      const armR = new THREE.Mesh(armGeo, skinMat);
      armR.position.set(0.6, 1.6, 0);
      armR.castShadow = true;

      // Cap (sferă)
      const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
      const head = new THREE.Mesh(headGeo, skinMat);
      head.position.set(0, 2.6, 0);
      head.castShadow = true;

      // Păr
      const hairGeo = new THREE.SphereGeometry(0.42, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      const hair = new THREE.Mesh(hairGeo, hairMat);
      hair.position.set(0, 2.65, 0);
      hair.castShadow = true;

      group.add(legL, legR, torso, armL, armR, head, hair);
      group.userData = { name, isNPC, legL, legR, armL, armR, torsoMat: shirtMat };
      return group;
    }

    // Creare Sim & NPC
    const sim = createHumanCharacter('Sim', '#e8a87c', false);
    sim.position.set(0, 0.2, 6);
    scene.add(sim);

    const npc = createHumanCharacter('Pufi', '#b19cd9', true);
    npc.position.set(-3, 0.2, 2);
    scene.add(npc);

    // --- STARE JOC ---
    let timeOfDay = 12;
    let needs = { foame: 100, energie: 100, igiena: 100, distractie: 100, social: 100 };
    let gameStarted = false;
    let targetPos = new THREE.Vector3(0, 0.2, 6);
    let simMoving = false;
    let isUsingAction = false;
    let actionTimer = 0;
    
    // Iconiță acțiune 3D
    const actionSprite = new THREE.Sprite(new THREE.SpriteMaterial({ color: '#fff' }));
    actionSprite.scale.set(1, 1, 1);
    actionSprite.visible = false;
    scene.add(actionSprite);

    // Creare texturi pentru iconițe (desenate pe canvas)
    function makeIconTexture(text) {
        const c = document.createElement('canvas');
        c.width = 64; c.height = 64;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(32, 32, 30, 0, Math.PI*2); ctx.fill();
        ctx.font = '32px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 32, 32);
        return new THREE.CanvasTexture(c);
    }
    const icons = {
        sleep: makeIconTexture('💤'),
        shower: makeIconTexture('💧'),
        eat: makeIconTexture('🍔'),
        fun: makeIconTexture('🎮'),
        talk: makeIconTexture('💬')
    };

    // --- CREATOR ---
    document.getElementById('color-picker').addEventListener('click', (e) => {
      if (e.target.classList.contains('color-option')) {
        document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
        e.target.classList.add('selected');
        sim.userData.color = e.target.dataset.color;
      }
    });
    document.querySelector('.color-option').classList.add('selected');

    document.getElementById('start-btn').addEventListener('click', () => {
      const nameInput = document.getElementById('sim-name').value.trim();
      if (nameInput) {
        sim.userData.name = nameInput;
        document.getElementById('ui-sim-name').innerText = nameInput;
      }
      
      sim.userData.torsoMat.color.set(sim.userData.color || '#e8a87c');

      document.getElementById('creator-screen').style.display = 'none';
      gameStarted = true;
    });

    // --- INTERACȚIUNE (RAYCASTER) ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('click', (e) => {
      if (!gameStarted || isUsingAction) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      
      // Verificăm obiecte
      const intersects = raycaster.intersectObjects(interactables.map(i => i.mesh));
      if (intersects.length > 0) {
        const hit = intersects[0].object;
        const objData = interactables.find(i => i.mesh === hit);
        
        if (objData) {
          targetPos.copy(objData.pos);
          // Calculăm o poziție lângă obiect
          targetPos.x += 1.5; 
          targetPos.y = objData.pos.y > 2 ? 4.2 : 0.2; // Ajustăm înălțimea pentru etajul 2
          simMoving = true;
          
          // Setăm acțiunea
          sim.userData.nextAction = objData.type;
          document.getElementById('status-msg').innerText = "Walking to " + objData.type;
        }
      }
    });

    // --- LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = Date.now() / 1000;

      if (gameStarted) {
        // Nevoi
        needs.foame = Math.max(0, needs.foame - 0.01);
        needs.energie = Math.max(0, needs.energie - 0.008);
        needs.igiena = Math.max(0, needs.igiena - 0.005);
        needs.distractie = Math.max(0, needs.distractie - 0.015);
        needs.social = Math.max(0, needs.social - 0.01);

        // UI Update
        const updateBar = (id, val) => {
          document.getElementById('val-' + id).innerText = Math.round(val) + '%';
          document.getElementById('bar-' + id).style.width = val + '%';
        };
        updateBar('foame', needs.foame);
        updateBar('energie', needs.energie);
        updateBar('igiena', needs.igiena);
        updateBar('distractie', needs.distractie);
        updateBar('social', needs.social);

        // Logica de mișcare și acțiune
        if (isUsingAction) {
            actionTimer -= delta;
            // Animație folosire obiect
            if (sim.userData.currentAction === 'energie') {
                sim.position.y = 4.6 + Math.sin(time * 2) * 0.1; // Se lasă pe pat
                sim.rotation.x = Math.PI / 2; // Se culcă
            } else if (sim.userData.currentAction === 'igiena') {
                sim.position.y = 4.2 + Math.abs(Math.sin(time * 10)) * 0.2; // Sare
            }
            
            if (actionTimer <= 0) {
                isUsingAction = false;
                sim.position.y = sim.position.y > 2 ? 4.2 : 0.2;
                sim.rotation.x = 0;
                actionSprite.visible = false;
                document.getElementById('status-msg').innerText = "Done!";
            }
        } else if (simMoving) {
          const dir = new THREE.Vector3().subVectors(targetPos, sim.position);
          dir.y = 0;
          const dist = dir.length();
          
          if (dist > 0.2) {
            dir.normalize();
            const speed = 3;
            sim.position.addScaledVector(dir, speed * delta);
            
            // Orientare
            const targetLook = sim.position.clone().add(dir);
            sim.lookAt(targetLook);

            // Animație mers
            const walkSwing = Math.sin(time * 10) * 0.5;
            sim.userData.legL.rotation.x = walkSwing;
            sim.userData.legR.rotation.x = -walkSwing;
            sim.userData.armL.rotation.x = -walkSwing;
            sim.userData.armR.rotation.x = walkSwing;
            
            // Verificăm dacă a ajuns la etajul 2 (teleportare pe scări)
            if (sim.position.y < 1 && targetPos.y > 2) {
                sim.position.y = 4.2;
            } else if (sim.position.y > 3 && targetPos.y < 1) {
                sim.position.y = 0.2;
            }

          } else {
            simMoving = false;
            // Oprim animația de mers
            sim.userData.legL.rotation.x = 0;
            sim.userData.legR.rotation.x = 0;
            sim.userData.armL.rotation.x = 0;
            sim.userData.armR.rotation.x = 0;

            // Pornim acțiunea
            if (sim.userData.nextAction) {
                isUsingAction = true;
                actionTimer = 3; // 3 secunde
                sim.userData.currentAction = sim.userData.nextAction;
                
                // Setăm iconița
                actionSprite.material.map = icons[sim.userData.nextAction] || icons.fun;
                actionSprite.visible = true;
                
                // Creștem nevoia
                if (sim.userData.nextAction === 'energie') needs.energie += 30;
                if (sim.userData.nextAction === 'igiena') needs.igiena += 30;
                if (sim.userData.nextAction === 'foame') needs.foame += 30;
                if (sim.userData.nextAction === 'distractie') needs.distractie += 30;
                if (sim.userData.nextAction === 'social') needs.social += 30;
                
                sim.userData.nextAction = null;
            }
          }
        }

        // Actualizare iconiță acțiune
        if (actionSprite.visible) {
            actionSprite.position.copy(sim.position);
            actionSprite.position.y += 3; // Deasupra capului
        }

        // NPC Wander
        if (Math.random() < 0.005) {
            npc.userData.target = new THREE.Vector3(-6 + Math.random() * 12, 0.2, -6 + Math.random() * 12);
        }
        if (npc.userData.target) {
            const dir = new THREE.Vector3().subVectors(npc.userData.target, npc.position);
            dir.y = 0;
            if (dir.length() > 0.2) {
                dir.normalize();
                npc.position.addScaledVector(dir, 1.5 * delta);
                const targetLook = npc.position.clone().add(dir);
                npc.lookAt(targetLook);
                // Animație NPC
                const swing = Math.sin(time * 10) * 0.5;
                npc.userData.legL.rotation.x = swing;
                npc.userData.legR.rotation.x = -swing;
                npc.userData.armL.rotation.x = -swing;
                npc.userData.armR.rotation.x = swing;
            } else {
                npc.userData.legL.rotation.x = 0;
                npc.userData.legR.rotation.x = 0;
                npc.userData.armL.rotation.x = 0;
                npc.userData.armR.rotation.x = 0;
            }
        }
      }

      controls.update(); // Pentru OrbitControls
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>

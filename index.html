<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Sim 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f5e6d3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    .game-container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      max-width: 95vw;
      height: 95vh;
    }

    #game-wrapper {
      position: relative;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      overflow: hidden;
      background: #faf0e6;
    }

    #game-container {
      display: block;
      cursor: grab;
      width: 800px;
      height: 600px;
    }
    #game-container:active { cursor: grabbing; }

    /* --- UI PANEL --- */
    .needs-panel {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      width: 250px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 600px;
      overflow-y: auto;
    }

    .needs-panel h3 {
      color: #8b7355;
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 5px;
    }

    .need-row { display: flex; flex-direction: column; gap: 4px; }
    
    .need-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #6b5b4d;
      font-weight: 600;
    }

    .progress-bg {
      background: #f0e0d0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .fill-foame { background-color: #e8a87c; }
    .fill-energie { background-color: #a8c3a6; }
    .fill-igiena { background-color: #89b0ae; }
    .fill-distractie { background-color: #d9a0b3; }
    .fill-social { background-color: #f4d06f; }

    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      color: #a88f76;
      font-style: italic;
      margin-top: auto;
      padding-top: 10px;
      min-height: 40px;
    }

    /* --- BUTOANE JOC --- */
    .controls {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      background: #e8a87c;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover { background: #d68f62; }
    .btn-outline {
      background: transparent;
      color: #e8a87c;
      border: 2px solid #e8a87c;
    }
    .btn-outline:hover { background: #fff5ee; }
    .btn.active { background: #a8c3a6; border-color: #a8c3a6; color: white; }
    .btn.active:hover { background: #8fae8d; }
    
    .btn-danger { color: #e57373; border-color: #e57373; }
    .btn-danger:hover { background: #ffebee; }

    /* --- CREATOR SCREEN --- */
    #creator-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #f5e6d3; display: flex; justify-content: center; align-items: center;
      flex-direction: column; z-index: 100;
    }

    .creator-box {
      background: #fff; padding: 40px; border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%;
    }

    .creator-box h1 { color: #8b7355; margin-bottom: 20px; font-size: 1.8rem; }
    .creator-box label { display: block; margin-bottom: 8px; color: #6b5b4d; font-weight: bold; }
    .creator-box input[type="text"] {
      width: 100%; padding: 12px; border: 2px solid #f0e0d0; border-radius: 10px;
      font-size: 1rem; margin-bottom: 20px; outline: none; text-align: center; color: #4a3728;
    }
    .creator-box input[type="text"]:focus { border-color: #e8a87c; }

    .color-picker { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
    .color-option {
      width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
      border: 3px solid transparent; transition: transform 0.2s;
    }
    .color-option:hover { transform: scale(1.1); }
    .color-option.selected { border-color: #4a3728; }

    .start-btn {
      background: #e8a87c; color: white; border: none; padding: 15px 30px;
      font-size: 1.1rem; border-radius: 12px; cursor: pointer; font-weight: bold;
      width: 100%; transition: background 0.2s;
    }
    .start-btn:hover { background: #d68f62; }
  </style>
</head>
<body>

  <div id="creator-screen">
    <div class="creator-box">
      <h1>Welcome! 🌸</h1>
      <p style="color: #a88f76; margin-bottom: 20px;">Create your human sim.</p>
      
      <label>What is your name?</label>
      <input type="text" id="sim-name" placeholder="Your name..." maxlength="12" value="Sim">

      <label>Choose a shirt color:</label>
      <div class="color-picker" id="color-picker">
        <div class="color-option" style="background: #e8a87c;" data-color="#e8a87c"></div>
        <div class="color-option" style="background: #a8c3a6;" data-color="#a8c3a6"></div>
        <div class="color-option" style="background: #89b0ae;" data-color="#89b0ae"></div>
        <div class="color-option" style="background: #d9a0b3;" data-color="#d9a0b3"></div>
        <div class="color-option" style="background: #b19cd9;" data-color="#b19cd9"></div>
      </div>

      <button class="start-btn" id="start-btn">Start Cozy Life</button>
    </div>
  </div>

  <div class="game-container">
    <div id="game-wrapper">
      <div id="game-container"></div>
    </div>
    
    <div class="needs-panel">
      <h3 id="ui-sim-name">Needs</h3>
      
      <div class="need-row">
        <div class="need-label"><span>🍔 Hunger</span> <span id="val-foame">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-foame" id="bar-foame" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>⚡ Energy</span> <span id="val-energie">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-energie" id="bar-energie" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>🚿 Hygiene</span> <span id="val-igiena">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-igiena" id="bar-igiena" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>🎮 Fun</span> <span id="val-distractie">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-distractie" id="bar-distractie" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>💬 Social</span> <span id="val-social">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-social" id="bar-social" style="width: 100%;"></div></div>
      </div>

      <div class="status-msg" id="status-msg">Click to move / drag to rotate.</div>

      <div class="controls">
        <button class="btn btn-outline btn-danger" id="reset-btn" style="font-size: 0.8rem; padding: 8px; margin-top: 10px;">🔄 Reset Life</button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // --- AUDIO ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playPop() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    // --- THREE.JS SETUP ---
    const container = document.getElementById('game-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#f5e6d3');
    scene.fog = new THREE.Fog('#f5e6d3', 20, 40);

    const camera = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 100);
    camera.position.set(0, 12, 12);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(800, 600);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- LUMINI ---
    const ambientLight = new THREE.AmbientLight('#fff5e6', 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight('#ffe8c4', 1.2);
    sunLight.position.set(10, 20, 10);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.left = -20;
    sunLight.shadow.camera.right = 20;
    sunLight.shadow.camera.top = 20;
    sunLight.shadow.camera.bottom = -20;
    scene.add(sunLight);

    // --- HELPERS PENTRU CONSTRUCȚIE ---
    function createBox(w, h, d, color, x, y, z) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // --- PODELE SI IARBA ---
    const grass = createBox(40, 0.2, 40, '#8fbc8f', 0, -0.1, 0);
    scene.add(grass);

    // Podeaua casei
    const floor = createBox(14, 0.1, 12, '#e8d5c4', 0, 0.05, 0);
    scene.add(floor);

    // --- CASA (PEREȚI) ---
    const wallColor = '#fdfbf7';
    // Perete spate
    scene.add(createBox(14, 4, 0.5, wallColor, 0, 2, -6));
    // Perete stânga
    scene.add(createBox(0.5, 4, 12, wallColor, -7, 2, 0));
    // Perete dreapta
    scene.add(createBox(0.5, 4, 12, wallColor, 7, 2, 0));
    // Perete față (cu loc de ușă)
    scene.add(createBox(5, 4, 0.5, wallColor, -4.5, 2, 6));
    scene.add(createBox(5, 4, 0.5, wallColor, 4.5, 2, 6));
    // Perete despărțitor interior
    scene.add(createBox(0.5, 4, 6, wallColor, 0, 2, -3));

    // --- MOBILĂ 3D ---
    // Pat
    const bedBase = createBox(3, 1, 4, '#8b5a2b', 4.5, 0.5, -4);
    const bedMattrass = createBox(2.8, 0.5, 3.8, '#fff', 4.5, 1.2, -4);
    const bedBlanket = createBox(2.8, 0.3, 2, '#fbcfe8', 4.5, 1.4, -3);
    const bedPillow = createBox(2, 0.4, 1, '#fdfbf7', 4.5, 1.5, -5);
    scene.add(bedBase, bedMattrass, bedBlanket, bedPillow);

    // Frigider
    const fridge = createBox(2, 3.5, 2, '#d1d5db', -5.5, 1.75, -4);
    scene.add(fridge);
    const fridgeHandle = createBox(0.1, 0.5, 0.1, '#9ca3af', -4.6, 2, -4);
    scene.add(fridgeHandle);

    // TV
    const tvStand = createBox(3, 1, 1.5, '#4b5563', 4.5, 0.5, 4);
    const tvScreen = createBox(2.6, 1.5, 0.2, '#1a1a1a', 4.5, 2, 4);
    scene.add(tvStand, tvScreen);

    // Duș
    const showerBase = createBox(2, 0.2, 2, '#bfdbfe', -5.5, 0.1, 4);
    const showerGlass = createBox(2, 3, 0.1, 'rgba(255,255,255,0.3)', -5.5, 1.5, 5);
    const showerGlass2 = createBox(0.1, 3, 2, 'rgba(255,255,255,0.3)', -6.5, 1.5, 4);
    scene.add(showerBase, showerGlass, showerGlass2);

    // Covor
    const rug = createBox(6, 0.05, 4, '#d9a0b3', 0, 0.1, 0);
    scene.add(rug);

    // Ușă
    const door = createBox(2, 3, 0.2, '#8b7355', 0, 1.5, 6);
    scene.add(door);

    // --- PERSONAJE 3D ---
    const characters = [];

    function createHumanCharacter(name, shirtColor, isNPC) {
      const group = new THREE.Group();
      
      const skinMat = new THREE.MeshStandardMaterial({ color: '#ffdfc4' });
      const pantsMat = new THREE.MeshStandardMaterial({ color: isNPC ? '#4a5568' : '#5c6bc0' });
      const shirtMat = new THREE.MeshStandardMaterial({ color: shirtColor });
      const hairMat = new THREE.MeshStandardMaterial({ color: '#6d4c41' });

      // Picioare
      const legGeo = new THREE.BoxGeometry(0.4, 0.8, 0.4);
      const legL = new THREE.Mesh(legGeo, pantsMat);
      legL.position.set(-0.25, 0.4, 0);
      legL.castShadow = true;
      const legR = new THREE.Mesh(legGeo, pantsMat);
      legR.position.set(0.25, 0.4, 0);
      legR.castShadow = true;

      // Corp
      const torsoGeo = new THREE.BoxGeometry(0.8, 1, 0.5);
      const torso = new THREE.Mesh(torsoGeo, shirtMat);
      torso.position.set(0, 1.3, 0);
      torso.castShadow = true;

      // Mâini
      const armGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
      const armL = new THREE.Mesh(armGeo, skinMat);
      armL.position.set(-0.6, 1.3, 0);
      armL.castShadow = true;
      const armR = new THREE.Mesh(armGeo, skinMat);
      armR.position.set(0.6, 1.3, 0);
      armR.castShadow = true;

      // Cap
      const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
      const head = new THREE.Mesh(headGeo, skinMat);
      head.position.set(0, 2.1, 0);
      head.castShadow = true;

      // Păr (calota de sus)
      const hairGeo = new THREE.SphereGeometry(0.42, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      const hair = new THREE.Mesh(hairGeo, hairMat);
      hair.position.set(0, 2.15, 0);
      hair.castShadow = true;

      group.add(legL, legR, torso, armL, armR, head, hair);
      group.userData = { name, isNPC, legL, legR, armL, armR };
      return group;
    }

    // Creăm Sim-ul și NPC-ul
    const sim = createHumanCharacter('Sim', '#e8a87c', false);
    sim.position.set(0, 0, 2);
    scene.add(sim);
    characters.push(sim);

    const npc = createHumanCharacter('Pufi', '#b19cd9', true);
    npc.position.set(-3, 0, 0);
    scene.add(npc);
    characters.push(npc);

    // --- STARE JOC ---
    let timeOfDay = 12;
    let needs = { foame: 100, energie: 100, igiena: 100, distractie: 100, social: 100 };
    let gameStarted = false;
    let targetPos = new THREE.Vector3(0, 0, 2);
    let simMoving = false;

    // Interacțiune cu obiectele (zone invizibile)
    const interactables = [
      { mesh: bedBase, type: 'energie', pos: new THREE.Vector3(4.5, 0, -4) },
      { mesh: fridge, type: 'foame', pos: new THREE.Vector3(-5.5, 0, -4) },
      { mesh: tvStand, type: 'distractie', pos: new THREE.Vector3(4.5, 0, 4) },
      { mesh: showerBase, type: 'igiena', pos: new THREE.Vector3(-5.5, 0, 4) },
      { mesh: npc, type: 'social', pos: npc.position }
    ];

    // --- CREATOR ---
    document.getElementById('color-picker').addEventListener('click', (e) => {
      if (e.target.classList.contains('color-option')) {
        document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
        e.target.classList.add('selected');
        sim.userData.color = e.target.dataset.color;
      }
    });
    document.querySelector('.color-option').classList.add('selected');

    document.getElementById('start-btn').addEventListener('click', () => {
      const nameInput = document.getElementById('sim-name').value.trim();
      if (nameInput) {
        sim.userData.name = nameInput;
        document.getElementById('ui-sim-name').innerText = nameInput;
      }
      
      // Actualizăm culoarea tricoului în 3D
      const shirtMat = sim.children[2].material;
      shirtMat.color.set(sim.userData.color || '#e8a87c');

      document.getElementById('creator-screen').style.display = 'none';
      gameStarted = true;
      initAudio();
      playPop();
    });

    // --- RAYCASTER (CLICK PE OBIECTE) ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('click', (e) => {
      if (!gameStarted) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      
      // Verificăm dacă am dat click pe podea sau iarbă
      const intersectsFloor = raycaster.intersectObjects([floor, grass]);
      // Verificăm dacă am dat click pe obiecte
      const intersectsObjects = raycaster.intersectObjects(interactables.map(i => i.mesh));

      if (intersectsObjects.length > 0) {
        // Am dat click pe un obiect
        const hit = intersectsObjects[0].object;
        const objData = interactables.find(i => i.mesh === hit);
        
        if (objData) {
          targetPos.copy(objData.pos);
          targetPos.y = 0;
          simMoving = true;
          
          if (objData.type === 'social') {
            needs.social = Math.min(100, needs.social + 50);
            document.getElementById('status-msg').innerText = "Talking to Pufi! 💬";
          } else {
            needs[objData.type] = Math.min(100, needs[objData.type] + 40);
            document.getElementById('status-msg').innerText = "Using " + objData.type;
          }
        }
      } else if (intersectsFloor.length > 0) {
        // Am dat click pe podea
        targetPos.copy(intersectsFloor[0].point);
        targetPos.y = 0;
        simMoving = true;
        document.getElementById('status-msg').innerText = "Walking...";
      }
    });

    // --- CAMERA CONTROL (ORBIT) ---
    let isPanning = false;
    let previousMousePosition = { x: 0, y: 0 };
    let cameraAngle = Math.PI / 4; // Unghiul inițial
    let cameraHeight = 12;
    let cameraDistance = 15;

    renderer.domElement.addEventListener('mousedown', (e) => {
      isPanning = true;
      previousMousePosition = { x: e.offsetX, y: e.offsetY };
    });

    renderer.domElement.addEventListener('mousemove', (e) => {
      if (isPanning) {
        const deltaX = e.offsetX - previousMousePosition.x;
        cameraAngle -= deltaX * 0.01;
        previousMousePosition = { x: e.offsetX, y: e.offsetY };
      }
    });

    renderer.domElement.addEventListener('mouseup', () => isPanning = false);
    renderer.domElement.addEventListener('mouseleave', () => isPanning = false);

    renderer.domElement.addEventListener('wheel', (e) => {
      e.preventDefault();
      cameraDistance += e.deltaY * 0.02;
      cameraDistance = Math.max(8, Math.min(25, cameraDistance));
    });

    // --- UPDATE LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = Date.now() / 1000;

      // Actualizare cameră (orbit)
      if (!isPanning) {
        camera.position.x = Math.sin(cameraAngle) * cameraDistance;
        camera.position.z = Math.cos(cameraAngle) * cameraDistance;
        camera.position.y = cameraHeight;
        camera.lookAt(0, 0, 0);
      }

      if (gameStarted) {
        // Nevoi
        needs.foame = Math.max(0, needs.foame - 0.01);
        needs.energie = Math.max(0, needs.energie - 0.008);
        needs.igiena = Math.max(0, needs.igiena - 0.005);
        needs.distractie = Math.max(0, needs.distractie - 0.015);
        needs.social = Math.max(0, needs.social - 0.01);

        // UI Update
        const updateBar = (id, val) => {
          document.getElementById('val-' + id).innerText = Math.round(val) + '%';
          document.getElementById('bar-' + id).style.width = val + '%';
        };
        updateBar('foame', needs.foame);
        updateBar('energie', needs.energie);
        updateBar('igiena', needs.igiena);
        updateBar('distractie', needs.distractie);
        updateBar('social', needs.social);

        // Mișcare Sim
        if (simMoving) {
          const dir = new THREE.Vector3().subVectors(targetPos, sim.position);
          dir.y = 0;
          const dist = dir.length();
          
          if (dist > 0.2) {
            dir.normalize();
            sim.position.addScaledVector(dir, 3 * delta);
            sim.lookAt(targetPos);
            
            // Animație mers (legănare)
            const walkSwing = Math.sin(time * 10) * 0.5;
            sim.userData.legL.rotation.x = walkSwing;
            sim.userData.legR.rotation.x = -walkSwing;
            sim.userData.armL.rotation.x = -walkSwing;
            sim.userData.armR.rotation.x = walkSwing;
          } else {
            simMoving = false;
            // Reset poziție
            sim.userData.legL.rotation.x = 0;
            sim.userData.legR.rotation.x = 0;
            sim.userData.armL.rotation.x = 0;
            sim.userData.armR.rotation.x = 0;
          }
        }

        // NPC Wander (se plimbă random)
        if (Math.random() < 0.005) {
          npc.userData.target = new THREE.Vector3(
            -6 + Math.random() * 12,
            0,
            -5 + Math.random() * 10
          );
        }
        if (npc.userData.target) {
          const dir = new THREE.Vector3().subVectors(npc.userData.target, npc.position);
          dir.y = 0;
          if (dir.length() > 0.2) {
            dir.normalize();
            npc.position.addScaledVector(dir, 1.5 * delta);
            npc.lookAt(npc.userData.target);
            // Animație mers NPC
            const swing = Math.sin(time * 10) * 0.5;
            npc.userData.legL.rotation.x = swing;
            npc.userData.legR.rotation.x = -swing;
            npc.userData.armL.rotation.x = -swing;
            npc.userData.armR.rotation.x = swing;
          } else {
            npc.userData.legL.rotation.x = 0;
            npc.userData.legR.rotation.x = 0;
            npc.userData.armL.rotation.x = 0;
            npc.userData.armR.rotation.x = 0;
          }
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    // Reset
    document.getElementById('reset-btn').addEventListener('click', () => {
      if (confirm("Are you sure you want to delete all progress?")) {
        localStorage.removeItem('cozySimData');
        location.reload();
      }
    });

  </script>
</body>
</html>

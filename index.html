<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Sim</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f5e6d3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      transition: background 2s ease;
    }

    .game-container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      max-width: 95vw;
    }

    canvas {
      background: #faf0e6;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      display: block;
      cursor: pointer;
      transition: background 2s ease;
    }

    /* --- UI PANEL --- */
    .needs-panel {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      width: 240px; /* Puțin mai lat pentru butoane */
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 400px;
    }

    .needs-panel h3 {
      color: #8b7355;
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 5px;
    }

    .need-row { display: flex; flex-direction: column; gap: 4px; }
    
    .need-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #6b5b4d;
      font-weight: 600;
    }

    .progress-bg {
      background: #f0e0d0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .fill-foame { background-color: #e8a87c; }
    .fill-energie { background-color: #a8c3a6; }
    .fill-igiena { background-color: #89b0ae; }
    .fill-distractie { background-color: #d9a0b3; }
    .fill-social { background-color: #f4d06f; }

    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      color: #a88f76;
      font-style: italic;
      margin-top: auto;
      padding-top: 10px;
    }

    /* --- BUTOANE JOC --- */
    .controls {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      background: #e8a87c;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover { background: #d68f62; }
    .btn-outline {
      background: transparent;
      color: #e8a87c;
      border: 2px solid #e8a87c;
    }
    .btn-outline:hover { background: #fff5ee; }
    .btn.active { background: #a8c3a6; }
    .btn.active:hover { background: #8fae8d; }

    /* --- MODAL MAGAZIN --- */
    #shop-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: none; /* Ascuns by default */
      justify-content: center;
      align-items: center;
      z-index: 50;
    }

    .shop-box {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      width: 500px;
      text-align: center;
    }
    .shop-box h2 { color: #8b7355; margin-bottom: 20px; }
    
    .shop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .shop-item {
      background: #faf0e6;
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      border: 2px solid transparent;
    }
    .shop-item:hover { transform: scale(1.05); background: #f0e0d0; }
    .shop-item.selected { border-color: #e8a87c; }
    
    .shop-item-emoji { font-size: 30px; display: block; margin-bottom: 5px; }
    .shop-item-name { font-size: 14px; color: #6b5b4d; font-weight: bold; }

    /* --- ECRAN CREARE PERSONAJ --- */
    #creator-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #f5e6d3;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
    }

    .creator-box {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .creator-box h1 { color: #8b7355; margin-bottom: 20px; font-size: 1.8rem; }
    .creator-box label { display: block; margin-bottom: 8px; color: #6b5b4d; font-weight: bold; }
    .creator-box input[type="text"] {
      width: 100%; padding: 12px; border: 2px solid #f0e0d0; border-radius: 10px;
      font-size: 1rem; margin-bottom: 20px; outline: none; text-align: center; color: #4a3728;
    }
    .creator-box input[type="text"]:focus { border-color: #e8a87c; }

    .color-picker { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
    .color-option {
      width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
      border: 3px solid transparent; transition: transform 0.2s;
    }
    .color-option:hover { transform: scale(1.1); }
    .color-option.selected { border-color: #4a3728; }

    .start-btn {
      background: #e8a87c; color: white; border: none; padding: 15px 30px;
      font-size: 1.1rem; border-radius: 12px; cursor: pointer; font-weight: bold;
      width: 100%; transition: background 0.2s;
    }
    .start-btn:hover { background: #d68f62; }
  </style>
</head>
<body>

  <!-- Ecran Creare Personaj -->
  <div id="creator-screen">
    <div class="creator-box">
      <h1>Bun venit! 🌸</h1>
      <p style="color: #a88f76; margin-bottom: 20px;">Creează-ți sim-ul pentru o viață cozy.</p>
      
      <label>Cum te numești?</label>
      <input type="text" id="sim-name" placeholder="Numele tău..." maxlength="12" value="Sim">

      <label>Alege o culoare:</label>
      <div class="color-picker" id="color-picker">
        <div class="color-option" style="background: #e8a87c;" data-color="#e8a87c"></div>
        <div class="color-option" style="background: #a8c3a6;" data-color="#a8c3a6"></div>
        <div class="color-option" style="background: #89b0ae;" data-color="#89b0ae"></div>
        <div class="color-option" style="background: #d9a0b3;" data-color="#d9a0b3"></div>
        <div class="color-option" style="background: #b19cd9;" data-color="#b19cd9"></div>
      </div>

      <button class="start-btn" id="start-btn">Începe viața cozy</button>
    </div>
  </div>

  <!-- Modal Magazin -->
  <div id="shop-modal">
    <div class="shop-box">
      <h2>Magazin Cozy 🛍️</h2>
      <div class="shop-grid" id="shop-grid">
        <!-- Generat dinamic din JS -->
      </div>
      <button class="btn" id="close-shop-btn">Închide</button>
    </div>
  </div>

  <!-- Jocul -->
  <div class="game-container">
    <canvas id="game" width="600" height="400"></canvas>
    
    <div class="needs-panel">
      <h3 id="ui-sim-name">Nevoi</h3>
      
      <div class="need-row">
        <div class="need-label"><span>🍔 Foame</span> <span id="val-foame">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-foame" id="bar-foame" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>⚡ Energie</span> <span id="val-energie">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-energie" id="bar-energie" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>🚿 Igienă</span> <span id="val-igiena">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-igiena" id="bar-igiena" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>🎮 Distracție</span> <span id="val-distractie">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-distractie" id="bar-distractie" style="width: 100%;"></div></div>
      </div>
      <div class="need-row">
        <div class="need-label"><span>💬 Social</span> <span id="val-social">100%</span></div>
        <div class="progress-bg"><div class="progress-fill fill-social" id="bar-social" style="width: 100%;"></div></div>
      </div>

      <div class="status-msg" id="status-msg">Dă click pe obiecte!</div>

      <div class="controls">
        <button class="btn" id="open-shop-btn">🛒 Adaugă Obiecte</button>
        <button class="btn btn-outline" id="edit-mode-btn">✏️ Editează Camera</button>
      </div>
    </div>
  </div>

  <script>
    window.onload = () => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      let timeOfDay = 12;
      let gameTime = 0;

      let sim = {
        x: 300, y: 250, targetX: 300, targetY: 250,
        speed: 3, color: '#e8a87c', name: 'Sim',
        state: 'idle', actionTimer: 0, bobOffset: 0
      };

      let npc = {
        x: 150, y: 150, targetX: 150, targetY: 150,
        speed: 1.5, color: '#b19cd9', name: 'Pufi',
        state: 'idle', actionTimer: 0, bobOffset: 0,
        speechBubble: null, speechTimer: 0
      };

      let needs = { foame: 100, energie: 100, igiena: 100, distractie: 100, social: 100 };

      // Obiectele inițiale
      let objects = [
        { id: 'frigider', name: 'Frigider', x: 70, y: 100, w: 40, h: 60, color: '#d1d5db', need: 'foame', emoji: '🍔' },
        { id: 'pat', name: 'Pat', x: 480, y: 80, w: 80, h: 50, color: '#fbcfe8', need: 'energie', emoji: '⚡' },
        { id: 'dus', name: 'Duș', x: 70, y: 300, w: 40, h: 40, color: '#bfdbfe', need: 'igiena', emoji: '🚿' },
        { id: 'tv', name: 'Televizor', x: 450, y: 300, w: 60, h: 40, color: '#4b5563', need: 'distractie', emoji: '🎮' }
      ];

      // Catalogul Magazinului
      const shopCatalog = [
        { id: 'planta', name: 'Plantă', w: 30, h: 40, color: '#a8c3a6', emoji: '🪴', need: 'igiena' },
        { id: 'lampa', name: 'Lampă', w: 30, h: 50, color: '#f4d06f', emoji: '💡', need: 'distractie' },
        { id: 'canapea', name: 'Canapea', w: 80, h: 40, color: '#d9a0b3', emoji: '🛋️', need: 'energie' },
        { id: 'tablou', name: 'Tablou', w: 50, h: 40, color: '#e8a87c', emoji: '🖼️', need: 'distractie' },
        { id: 'cafea', name: 'Cafea', w: 30, h: 30, color: '#6b5b4d', emoji: '☕', need: 'energie' },
        { id: 'chitara', name: 'Chitară', w: 40, h: 50, color: '#d68f62', emoji: '🎸', need: 'distractie' }
      ];

      const dialogues = [
        "Ce mai faci astăzi?", "Îmi place la tine acasă!", "Ai grijă să mănânci!",
        "Hai să ne uităm la un film.", "E o zi frumoasă afară.", "Mă bucur că ești aici!"
      ];

      let gameStarted = false;
      let isEditMode = false;
      let draggedObject = null;
      let dragOffsetX = 0;
      let dragOffsetY = 0;

      // --- CREARE PERSONAJ ---
      document.getElementById('color-picker').addEventListener('click', (e) => {
        if (e.target.classList.contains('color-option')) {
          document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
          e.target.classList.add('selected');
          sim.color = e.target.dataset.color;
        }
      });
      document.querySelector('.color-option').classList.add('selected');

      document.getElementById('start-btn').addEventListener('click', () => {
        const nameInput = document.getElementById('sim-name').value.trim();
        if (nameInput) sim.name = nameInput;
        
        document.getElementById('ui-sim-name').innerText = sim.name;
        document.getElementById('creator-screen').style.display = 'none';
        gameStarted = true;
        saveGame();
      });

      // --- SALVARE / ÎNCĂRCARE ---
      function saveGame() {
        localStorage.setItem('cozySimData', JSON.stringify({
          name: sim.name, color: sim.color, needs: needs, timeOfDay: timeOfDay, objects: objects
        }));
      }

      const savedData = localStorage.getItem('cozySimData');
      if (savedData) {
        const data = JSON.parse(savedData);
        document.getElementById('sim-name').value = data.name;
        sim.name = data.name;
        sim.color = data.color;
        needs = data.needs;
        if (data.timeOfDay) timeOfDay = data.timeOfDay;
        if (data.objects) objects = data.objects; // Încărcăm și obiectele adăugate/mutate
        
        document.querySelectorAll('.color-option').forEach(el => {
          if (el.dataset.color === data.color) el.classList.add('selected');
        });
      }

      // --- MAGAZIN ---
      const shopModal = document.getElementById('shop-modal');
      const shopGrid = document.getElementById('shop-grid');
      
      document.getElementById('open-shop-btn').addEventListener('click', () => {
        shopGrid.innerHTML = '';
        shopCatalog.forEach(item => {
          const div = document.createElement('div');
          div.className = 'shop-item';
          div.innerHTML = `<span class="shop-item-emoji">${item.emoji}</span><span class="shop-item-name">${item.name}</span>`;
          div.addEventListener('click', () => {
            // Adăugăm obiectul în cameră (la o poziție random)
            const newObj = { ...item, x: 150 + Math.random()*300, y: 150 + Math.random()*150 };
            objects.push(newObj);
            saveGame();
            shopModal.style.display = 'none';
            document.getElementById('status-msg').innerText = "Ai adăugat " + item.name + "!";
          });
          shopGrid.appendChild(div);
        });
        shopModal.style.display = 'flex';
      });

      document.getElementById('close-shop-btn').addEventListener('click', () => {
        shopModal.style.display = 'none';
      });

      // --- MOD EDITARE ---
      const editBtn = document.getElementById('edit-mode-btn');
      editBtn.addEventListener('click', () => {
        isEditMode = !isEditMode;
        if (isEditMode) {
          editBtn.innerText = "✅ Salvează și Ieși";
          editBtn.classList.add('active');
          document.getElementById('status-msg').innerText = "Trage obiectele cu mouse-ul!";
          canvas.style.cursor = 'grab';
        } else {
          editBtn.innerText = "✏️ Editează Camera";
          editBtn.classList.remove('active');
          document.getElementById('status-msg').innerText = "Mod joc activat.";
          canvas.style.cursor = 'pointer';
          saveGame();
        }
      });

      // --- LOGICA DE UPDATE ---
      function update() {
        if (!gameStarted) return;

        // Timp
        gameTime++;
        if (gameTime >= 60) {
            timeOfDay += 0.1;
            if (timeOfDay >= 24) timeOfDay = 0;
            gameTime = 0;
        }

        // Nevoi
        needs.foame = Math.max(0, needs.foame - 0.015);
        needs.energie = Math.max(0, needs.energie - 0.01);
        needs.igiena = Math.max(0, needs.igiena - 0.008);
        needs.distractie = Math.max(0, needs.distractie - 0.02);
        needs.social = Math.max(0, needs.social - 0.012);

        // Bob
        sim.bobOffset = Math.sin(Date.now() / 500) * 2;
        npc.bobOffset = Math.sin(Date.now() / 550) * 2;

        // Mișcare Sim (doar dacă nu suntem în Edit Mode)
        if (!isEditMode) {
            if (sim.state === 'walking') {
            const dx = sim.targetX - sim.x;
            const dy = sim.targetY - sim.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > sim.speed) {
                sim.x += (dx / dist) * sim.speed;
                sim.y += (dy / dist) * sim.speed;
            } else {
                sim.x = sim.targetX;
                sim.y = sim.targetY;
                sim.state = 'using';
                sim.actionTimer = 120;
            }
            } else if (sim.state === 'using') {
            sim.actionTimer--;
            if (sim.actionTimer <= 0) sim.state = 'idle';
            }
        }

        // Mișcare NPC
        if (npc.speechTimer > 0) {
            npc.speechTimer--;
            if (npc.speechTimer <= 0) npc.speechBubble = null;
        }

        if (npc.state === 'idle') {
          if (Math.random() < 0.005) {
            npc.targetX = 80 + Math.random() * 400;
            npc.targetY = 80 + Math.random() * 250;
            npc.state = 'walking';
          }
        } else if (npc.state === 'walking') {
          const dx = npc.targetX - npc.x;
          const dy = npc.targetY - npc.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > npc.speed) {
            npc.x += (dx / dist) * npc.speed;
            npc.y += (dy / dist) * npc.speed;
          } else {
            npc.state = 'idle';
          }
        }

        // UI Update
        const updateBar = (id, val) => {
          document.getElementById('val-' + id).innerText = Math.round(val) + '%';
          document.getElementById('bar-' + id).style.width = val + '%';
        };
        updateBar('foame', needs.foame);
        updateBar('energie', needs.energie);
        updateBar('igiena', needs.igiena);
        updateBar('distractie', needs.distractie);
        updateBar('social', needs.social);

        // Salvare automata
        if (Math.random() < 0.002) saveGame();
      }

      // --- DESENARE ---
      function draw() {
        let dayNightAlpha = 0;
        if (timeOfDay < 6 || timeOfDay > 20) dayNightAlpha = 0.7;
        else if (timeOfDay < 8) dayNightAlpha = 0.7 - ((timeOfDay - 6) / 2) * 0.7;
        else if (timeOfDay > 18) dayNightAlpha = ((timeOfDay - 18) / 2) * 0.7;

        ctx.fillStyle = '#faf0e6';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (!gameStarted) return;

        // Covor
        ctx.fillStyle = '#f0e0d0';
        ctx.beginPath();
        ctx.roundRect(50, 50, 500, 300, 20);
        ctx.fill();

        // Obiecte
        objects.forEach(obj => {
          ctx.fillStyle = obj.color;
          ctx.beginPath();
          // Umbră obiect
          ctx.shadowColor = 'rgba(0,0,0,0.1)';
          ctx.shadowBlur = 4;
          ctx.shadowOffsetY = 2;
          ctx.roundRect(obj.x, obj.y, obj.w, obj.h, 8);
          ctx.fill();
          ctx.shadowColor = 'transparent'; // reset

          ctx.font = '24px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(obj.emoji, obj.x + obj.w / 2, obj.y - 10);
          ctx.font = '10px system-ui';
          ctx.fillStyle = '#6b5b4d';
          ctx.fillText(obj.name, obj.x + obj.w / 2, obj.y + obj.h + 15);
        });

        // Funcție personaje
        function drawCharacter(char, isNPC) {
          let yOffset = char.bobOffset;
          
          ctx.shadowColor = 'rgba(0,0,0,0.1)';
          ctx.shadowBlur = 8;
          ctx.shadowOffsetY = 3;

          let cColor = char.color;
          if (!isNPC && (needs.foame < 20 || needs.energie < 20)) cColor = '#e57373';

          ctx.beginPath();
          ctx.arc(char.x, char.y + yOffset, 16, 0, Math.PI * 2);
          ctx.fillStyle = cColor;
          ctx.fill();

          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;

          // Ochi
          ctx.beginPath();
          ctx.arc(char.x - 5, char.y - 4 + yOffset, 2.5, 0, Math.PI * 2);
          ctx.arc(char.x + 5, char.y - 4 + yOffset, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = '#4a3728';
          ctx.fill();

          // Nume
          ctx.font = '12px system-ui';
          ctx.fillStyle = '#8b7355';
          ctx.textAlign = 'center';
          ctx.fillText(char.name, char.x, char.y - 26 + yOffset);
        }

        // Gânduri
        let lowestNeed = 'foame';
        let lowestVal = needs.foame;
        if (needs.energie < lowestVal) { lowestVal = needs.energie; lowestNeed = 'energie'; }
        if (needs.igiena < lowestVal) { lowestVal = needs.igiena; lowestNeed = 'igiena'; }
        if (needs.distractie < lowestVal) { lowestVal = needs.distractie; lowestNeed = 'distractie'; }
        if (needs.social < lowestVal) { lowestVal = needs.social; lowestNeed = 'social'; }

        if (lowestVal < 30 && sim.state === 'idle') {
          const needObj = objects.find(o => o.need === lowestNeed) || { emoji: '💬' };
          ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.beginPath();
          ctx.arc(sim.x + 20, sim.y - 40 + sim.bobOffset, 15, 0, Math.PI * 2);
          ctx.fill();
          ctx.font = '16px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(needObj.emoji, sim.x + 20, sim.y - 35 + sim.bobOffset);
        }

        drawCharacter(npc, true);
        drawCharacter(sim, false);

        // Dialog NPC
        if (npc.speechBubble) {
            ctx.fillStyle = 'white';
            ctx.strokeStyle = '#d1d5db';
            ctx.lineWidth = 2;
            ctx.font = '12px system-ui';
            const textWidth = ctx.measureText(npc.speechBubble).width;
            const boxW = textWidth + 20;
            const boxH = 30;
            const boxX = npc.x - boxW / 2;
            const boxY = npc.y - 70 + npc.bobOffset;

            ctx.beginPath();
            ctx.roundRect(boxX, boxY, boxW, boxH, 8);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(npc.x - 5, boxY + boxH);
            ctx.lineTo(npc.x + 5, boxY + boxH);
            ctx.lineTo(npc.x, boxY + boxH + 8);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#4a3728';
            ctx.textAlign = 'center';
            ctx.fillText(npc.speechBubble, npc.x, boxY + 19);
        }

        // Overlay noapte
        if (dayNightAlpha > 0) {
            ctx.fillStyle = `rgba(30, 40, 70, ${dayNightAlpha})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const gradient = ctx.createRadialGradient(300, 200, 50, 300, 200, 300);
            gradient.addColorStop(0, `rgba(255, 200, 100, ${dayNightAlpha * 0.4})`);
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      }

      // --- INTERACȚIUNE ---
      
      // Funcție helper pentru a găsi obiectul la o anumită poziție
      function getObjectAt(x, y) {
        for (let obj of objects) {
            if (x >= obj.x && x <= obj.x + obj.w && y >= obj.y && y <= obj.y + obj.h) {
                return obj;
            }
        }
        return null;
      }

      // Mouse Down (pentru drag & drop)
      canvas.addEventListener('mousedown', (e) => {
        if (!gameStarted || !isEditMode) return;
        
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;

        const obj = getObjectAt(clickX, clickY);
        if (obj) {
            draggedObject = obj;
            dragOffsetX = clickX - obj.x;
            dragOffsetY = clickY - obj.y;
            canvas.style.cursor = 'grabbing';
        }
      });

      // Mouse Move (pentru drag & drop)
      canvas.addEventListener('mousemove', (e) => {
        if (!isEditMode || !draggedObject) return;

        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;

        // Mutăm obiectul
        draggedObject.x = clickX - dragOffsetX;
        draggedObject.y = clickY - dragOffsetY;
      });

      // Mouse Up (eliberăm obiectul)
      canvas.addEventListener('mouseup', () => {
        if (draggedObject) {
            draggedObject = null;
            canvas.style.cursor = 'grab';
        }
      });

      // Click (pentru acțiuni normale)
      canvas.addEventListener('click', (e) => {
        if (!gameStarted || isEditMode) return; // Nu facem acțiuni în Edit Mode
        
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;

        // Click pe NPC
        const dxNpc = clickX - npc.x;
        const dyNpc = clickY - npc.y;
        if (Math.sqrt(dxNpc*dxNpc + dyNpc*dyNpc) < 25) {
          sim.targetX = npc.x - 30;
          sim.targetY = npc.y;
          sim.state = 'walking';
          needs.social = Math.min(100, needs.social + 50);
          document.getElementById('status-msg').innerText = "Vorbit cu " + npc.name + "! 💬";
          npc.speechBubble = dialogues[Math.floor(Math.random() * dialogues.length)];
          npc.speechTimer = 180;
          return;
        }

        // Click pe Obiecte
        const clickedObject = getObjectAt(clickX, clickY);
        if (clickedObject) {
          sim.targetX = clickedObject.x + clickedObject.w / 2;
          sim.targetY = clickedObject.y + clickedObject.h + 25;
          sim.state = 'walking';
          if (clickedObject.need) {
              needs[clickedObject.need] = Math.min(100, needs[clickedObject.need] + 40);
          }
          document.getElementById('status-msg').innerText = "Folosește " + clickedObject.name;
        } else {
          sim.targetX = clickX;
          sim.targetY = clickY;
          sim.state = 'walking';
        }
      });

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      loop();
    };
  </script>
</body>
</html>
